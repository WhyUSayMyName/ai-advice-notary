<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Yggdrasil</title>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }

  body {
    font: 400 13px/1.5 "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    opacity: 1; transition: opacity .24s ease;
  }
  body.out { opacity: 0; }

  .frame {
    position: relative; height: 100%; border-radius: 14px; overflow: hidden;
    background:
      radial-gradient(40% 32% at 50% 22%, rgba(180, 235, 250, .24) 0%, rgba(120, 190, 230, .10) 42%, rgba(30, 35, 82, 0) 76%),
      radial-gradient(94% 76% at 50% 14%, #2A3168 0%, #1A1E48 46%, #0B0D28 80%, #070818 100%);
    box-shadow: inset 0 0 0 1px rgba(160, 190, 240, .16);
  }

  .scene { position: absolute; inset: 0; width: 100%; height: 100%; }

  .mist {
    position: absolute; left: -14%; right: -14%; top: 44%; height: 150px;
    background: linear-gradient(to bottom,
      rgba(126, 143, 205, 0), rgba(133, 154, 210, .2), rgba(126, 143, 205, 0));
    filter: blur(12px);
    animation: drift 26s linear infinite alternate;
  }
  @keyframes drift { from { transform: translateX(-5%); } to { transform: translateX(5%); } }

  /* Горизонт: тьма к низу кадра. Взято из brand-identity — подпись и полоса
     прогресса перестают конкурировать с силуэтами древ. */
  .horizon {
    position: absolute; left: 0; right: 0; bottom: 0; height: 168px; z-index: 5;
    background: linear-gradient(to bottom,
      rgba(7, 8, 24, 0) 0%, rgba(7, 8, 24, .74) 58%, rgba(7, 8, 24, .96) 100%);
    pointer-events: none;
  }

  .mote {
    position: absolute; border-radius: 50%; background: rgba(198, 238, 250, .75);
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    12%  { opacity: .85; }
    88%  { opacity: .5; }
    100% { transform: translateY(-290px) translateX(16px); opacity: 0; }
  }

  .stage {
    position: absolute; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding-bottom: 40px;
  }

  /* Знак-руна — источник света в кадре и одновременно индикатор загрузки:
     свет поднимается по руне снизу вверх, корень → ствол → ветви. */
  .sigil { position: relative; opacity: 0; animation: emerge .9s ease-out forwards; }
  .rune-fill { opacity: 0; transition: opacity .3s ease; }
  .sigil.metered .rune-base { opacity: .24; }
  .sigil.metered .rune-fill { opacity: 1; }
  #riserect { transition: y .42s cubic-bezier(.4, 0, .2, 1), height .42s cubic-bezier(.4, 0, .2, 1); }
  .sigil::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 176px; height: 176px; transform: translate(-50%, -50%);
    background: radial-gradient(closest-side,
      rgba(240, 251, 255, .46) 0%, rgba(150, 220, 245, .24) 34%, rgba(110, 190, 235, 0) 72%);
    animation: breathe 6s ease-in-out infinite;
  }
  .sigil svg { position: relative; display: block; }

  @keyframes breathe {
    0%, 100% { opacity: .8;  transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
  }

  .wordmark {
    width: 398px; height: auto; margin-top: 16px;
    opacity: 0; animation: appear .5s ease-out .22s forwards;
  }
  /* Вордмарк не проявляется, а вырезается: штрих идёт по буквам.
     README называет его «вырезанным вектором» — теперь это видно. */
  .wordmark path {
    stroke-dasharray: 430; stroke-dashoffset: 430;
    animation: carve 1.6s cubic-bezier(.32, .72, .18, 1) .3s forwards;
  }
  @keyframes carve { to { stroke-dashoffset: 0; } }
  @keyframes appear { to { opacity: 1; } }

  /* Руны подчинены вордмарку: тоньше, уже, глуше — это подпись, не второй логотип */
  .runes {
    margin-top: 16px; opacity: 0;
    animation: emergeRunes .9s ease-out .62s forwards;
  }

  .kenning {
    margin-top: 16px; font-size: 10px; letter-spacing: .34em; text-transform: uppercase;
    color: #BCEAF4; opacity: 0;
    animation: emergeSoft .9s ease-out .92s forwards;
  }

  @keyframes emerge {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes emergeRunes {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: .34; transform: none; }
  }
  @keyframes emergeSoft {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: .82; transform: none; }
  }

  /* Иней не появляется готовым — он нарастает, как узор на стекле */
  .thicket-draw {
    stroke-dasharray: 92; stroke-dashoffset: 92;
    animation: frostgrow 1.5s ease-out .4s forwards;
  }
  @keyframes frostgrow { to { stroke-dashoffset: 0; } }
  .bloom { opacity: 0; animation: appear .8s ease-out 1.5s forwards; }

  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7;
    padding: 0 22px 15px;
  }

  .row { display: flex; align-items: baseline; gap: 14px; }
  .status {
    color: #BCEAF4; font-size: 12px; letter-spacing: .02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Правый слот — процент. Прежде здесь стояло слово Yggdrasil: третье
     повторение имени в одном кадре и ноль информации о загрузке. */
  .pct {
    margin-left: auto; flex: none;
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 11px; font-variant-numeric: tabular-nums;
    color: #6E769B; opacity: 0; transition: opacity .2s ease;
  }
  .pct.on { opacity: 1; }

  /* Сбой запуска: свет разлома гаснет, руна краснеет.
     Единственный тревожный цвет проекта — и только по делу. */
  .status.err { color: #E0655C; }
  .frame.err .sigil::before { opacity: .2; animation: none; }
  .frame.err .rune-fill { stroke: #E0655C; }
  .frame.err .rune-base { opacity: .18; }

  @media (prefers-reduced-motion: reduce) {
    .sigil::before, .mist, .mote { animation: none; }
    .sigil, .wordmark, .runes, .kenning, .bloom { animation-duration: .01s; }
    .wordmark path, .thicket-draw { animation: none; stroke-dashoffset: 0; }
  }
</style>
<template id="__bundler_thumbnail" data-bg-color="#070818">
  <svg viewBox="0 0 660 430" xmlns="http://www.w3.org/2000/svg">
    <rect width="660" height="430" fill="#0B0D28"/>
    <circle cx="330" cy="180" r="118" fill="#1A1E48"/>
    <g fill="none" stroke="#F0FBFF" stroke-width="14" stroke-linecap="square"
       transform="translate(330 180) scale(4.4) translate(-20 -20)">
      <path d="M20 4v32M20 12l9-6M20 12l-9-6M20 22l11-7M20 22L9 15M20 36c-7 0-11-5-12-10M20 36c7 0 11-5 12-10"/>
    </g>
    <rect x="0" y="330" width="660" height="100" fill="#0A0B22"/>
  </svg>
</template>
</head>
<body>
  <div class="frame">
    <svg class="scene" viewBox="0 0 660 430" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <!-- дальний ярус: стволы в дымке -->
      <g fill="#39406F" opacity=".45">
        <path d="M110 430V180c0-26-9-43-19-60 19 5 33 17 39 37 5-21 17-34 34-43-9 19-10 37-5 59 4 17 5 30 5 49v208z"/>
        <path d="M540 430V200c0-30-10-48-24-67 23 6 40 20 47 45 6-26 20-41 42-51-11 23-13 43-6 69 5 19 6 36 6 59v145z"/>
        <path d="M330 430V246c0-20-7-33-15-46 15 4 25 13 30 28 4-16 13-26 26-33-7 15-8 28-4 45 3 13 4 23 4 37v153z"/>
      </g>

      <!-- ближний ярус: исполины по краям кадра -->
      <g fill="#22254A">
        <path d="M0 430V100c30 6 54 22 68 48 12-37 28-62 59-79-19 35-22 67-10 105 9 30 12 55 12 90v166z"/>
        <path d="M660 430V70c-41 6-74 26-94 59-14-44-36-73-74-95 24 43 28 82 14 130-10 36-13 67-13 108v158z"/>
        <path d="M232 430V232c0-26-9-42-21-59 20 6 35 19 42 41 6-23 18-37 37-46-10 20-11 38-5 61 5 18 6 32 6 53v148z"/>
        <path d="M430 430V250c0-22-8-36-18-50 17 5 30 16 36 35 5-20 15-31 31-39-8 17-9 32-4 52 4 15 5 27 5 45v137z"/>
      </g>

      <!-- Ледяные папоротники.
           Прежде это были четыре звёздочки из прямых лучей, выходящих из одной
           точки. Теперь один куст = изогнутый стебель + перистые вайи, у каждой
           вайи свои иголки: так растёт настоящий морозный узор на стекле.
           Куст описан один раз и расставлен через <use> с разным масштабом
           и наклоном — кусты одной породы, но ни один не повторяет соседа. -->
      <defs>
        <filter id="frostglow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4"/>
        </filter>

        <!-- вайя: растёт вправо-вверх, с тремя иголками -->
        <g id="frond">
          <path d="M0 0C6 -1.6 11 -4.6 16 -11"/>
          <path d="M4.6 -1.4 L6.6 -6.2M8.6 -3.4 L10.8 -8.2M12.2 -6.4 L14 -11"/>
        </g>

        <!-- куст: стебель клонится, вайи мельчают к вершине -->
        <g id="fern">
          <path d="M0 0C-2 -13 -1 -26 2 -36c1.5 -5 2.4 -8.6 3 -12"/>
          <use href="#frond" transform="translate(-0.9 -7.5) scale(-1.06 1.06)"/>
          <use href="#frond" transform="translate(0.9 -9.5) scale(0.98)"/>
          <use href="#frond" transform="translate(-0.8 -16.5) scale(-0.86 0.86)"/>
          <use href="#frond" transform="translate(0.8 -18.5) scale(0.78)"/>
          <use href="#frond" transform="translate(0 -25) scale(-0.62 0.62)"/>
          <use href="#frond" transform="translate(1.4 -27) scale(0.56)"/>
          <use href="#frond" transform="translate(1.6 -32.5) scale(-0.42 0.42)"/>
          <use href="#frond" transform="translate(2.6 -34.5) scale(0.36)"/>
        </g>

        <!-- заросль целиком: крупные кусты с подростом у корня -->
        <g id="thicket">
          <use href="#fern" transform="translate(64 396) rotate(-6) scale(1.55)"/>
          <use href="#fern" transform="translate(104 402) rotate(9) scale(0.95)"/>
          <use href="#fern" transform="translate(38 400) rotate(-15) scale(0.62)"/>
          <use href="#fern" transform="translate(600 384) rotate(7) scale(1.5)"/>
          <use href="#fern" transform="translate(564 393) rotate(-11) scale(0.9)"/>
          <use href="#fern" transform="translate(628 390) rotate(16) scale(0.6)"/>
          <use href="#fern" transform="translate(262 392) rotate(-5) scale(1.15)"/>
          <use href="#fern" transform="translate(292 397) rotate(11) scale(0.66)"/>
          <use href="#fern" transform="translate(452 396) rotate(6) scale(1.2)"/>
          <use href="#fern" transform="translate(422 400) rotate(-9) scale(0.7)"/>
          <use href="#fern" transform="translate(348 402) rotate(3) scale(0.72)"/>
        </g>
      </defs>

      <!-- почва: корни уходят в темноту -->
      <path d="M0 430v-48c68-15 121-5 169 12 52 19 100 25 165 12 66-13 126-19 191-6 52 11 98 12 135 4v26z" fill="#111330"/>
      <path d="M0 430v-27c84-16 141-2 200 14 54 16 110 18 173 4 66-14 131-17 196-3 37 8 72 10 91 7v5z" fill="#0A0B22"/>
          <!-- иней светится: широкий размытый след под тонким чётким штрихом -->
      <use class="thicket-draw" href="#thicket" fill="none" stroke="#9FE2F2" stroke-width="4"
           stroke-linecap="round" opacity=".24" filter="url(#frostglow)"/>
      <use class="thicket-draw" href="#thicket" fill="none" stroke="#8FD9EC" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" opacity=".62"/>

      <!-- соцветия сидят на вершинах кустов, каждое в своём ореоле -->
      <g class="bloom">
        <g fill="#E294C6" opacity=".2">
          <circle cx="72" cy="323" r="6.5"/><circle cx="608" cy="311" r="6.5"/>
          <circle cx="268" cy="338" r="5.5"/><circle cx="458" cy="340" r="5.5"/>
        </g>
        <g fill="#E294C6" opacity=".78">
          <circle cx="72" cy="323" r="2.6"/><circle cx="59" cy="340" r="2"/><circle cx="85" cy="337" r="1.7"/>
          <circle cx="608" cy="311" r="2.6"/><circle cx="595" cy="328" r="2"/><circle cx="621" cy="325" r="1.7"/>
          <circle cx="268" cy="338" r="2.1"/><circle cx="256" cy="353" r="1.7"/>
          <circle cx="458" cy="340" r="2.1"/><circle cx="445" cy="354" r="1.7"/>
        </g>
      </g>


    </svg>

    <div class="mist"></div>
    <div class="horizon"></div>

    <div class="stage">
      <div class="sigil" id="sigil" role="progressbar" aria-label="Загрузка"
           aria-valuemin="0" aria-valuemax="100">
        <svg width="52" height="52" viewBox="0 0 40 40" fill="none" stroke="#F0FBFF"
             stroke-width="2.4" stroke-linecap="square" aria-hidden="true">
          <defs>
            <clipPath id="riseclip">
              <rect id="riserect" x="-4" y="44" width="48" height="0"/>
            </clipPath>
          </defs>
          <path class="rune-base" d="M20 4v32M20 12l9-6M20 12l-9-6M20 22l11-7M20 22L9 15M20 36c-7 0-11-5-12-10M20 36c7 0 11-5 12-10"/>
          <path class="rune-fill" clip-path="url(#riseclip)"
                style="filter: drop-shadow(0 0 5px rgba(150, 220, 245, .85))"
                d="M20 4v32M20 12l9-6M20 12l-9-6M20 22l11-7M20 22L9 15M20 36c-7 0-11-5-12-10M20 36c7 0 11-5 12-10"/>
        </svg>
      </div>

      <svg class="wordmark" viewBox="-26 -30 694 160" role="img" aria-label="YGGDRASIL">
        <defs>
          <!-- userSpaceOnUse обязателен: буква I — вертикальный штрих с нулевой
               шириной bbox, в objectBoundingBox градиент для неё не вычисляется -->
          <linearGradient id="carve" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="52%" stop-color="#DCF2FB"/>
            <stop offset="100%" stop-color="#8FC4DE"/>
          </linearGradient>
          <!-- halo мягче прежнего: на 398px сильное свечение съедало засечки штрихов -->
          <filter id="halo" x="-30%" y="-40%" width="160%" height="190%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g fill="none" stroke="url(#carve)" stroke-width="9"
           stroke-linecap="square" stroke-linejoin="miter" filter="url(#halo)">
          <g transform="translate(0,0)"><path d="M0 0 L30 52 L60 0 M30 52 L30 100"/></g>
          <g transform="translate(82,0)"><path d="M58 22 L38 2 L20 2 L2 20 L2 80 L20 98 L38 98 L58 78 L58 54 L36 54"/></g>
          <g transform="translate(164,0)"><path d="M58 22 L38 2 L20 2 L2 20 L2 80 L20 98 L38 98 L58 78 L58 54 L36 54"/></g>
          <g transform="translate(246,0)"><path d="M4 2 L4 98 M4 2 L34 2 L56 24 L56 76 L34 98 L4 98"/></g>
          <g transform="translate(326,0)"><path d="M4 2 L4 98 M4 2 L34 2 L54 20 L54 38 L34 56 L4 56 M30 56 L56 98"/></g>
          <g transform="translate(404,0)"><path d="M2 98 L30 2 L58 98 M14 64 L46 64"/></g>
          <g transform="translate(486,0)"><path d="M50 18 L36 2 L16 2 L2 18 L2 32 L14 46 L38 54 L50 68 L50 82 L36 98 L16 98 L2 82"/></g>
          <g transform="translate(560,0)"><path d="M6 2 L6 98"/></g>
          <g transform="translate(594,0)"><path d="M4 2 L4 98 L46 98"/></g>
        </g>
      </svg>

      <svg class="runes" width="196" height="30" viewBox="-4 -4 298 52" aria-hidden="true">
        <g fill="none" stroke="#BCEAF4" stroke-width="3.4" stroke-linecap="square">
          <g transform="translate(0,0)"><path d="M10 6 L10 34 M10 6 L18 2 M10 34 L2 38"/></g>
          <g transform="translate(30,0)"><path d="M2 2 L26 38 M26 2 L2 38"/></g>
          <g transform="translate(68,0)"><path d="M2 2 L26 38 M26 2 L2 38"/></g>
          <g transform="translate(106,0)"><path d="M3 2 L3 38 M25 2 L25 38 M3 2 L25 38 M3 38 L25 2"/></g>
          <g transform="translate(144,0)"><path d="M4 2 L4 38 M4 2 L20 10 L4 20 M4 20 L20 38"/></g>
          <g transform="translate(178,0)"><path d="M4 2 L4 38 M4 6 L18 14 M4 20 L18 28"/></g>
          <g transform="translate(210,0)"><path d="M18 2 L4 14 L18 26 L4 38"/></g>
          <g transform="translate(242,0)"><path d="M5 2 L5 38"/></g>
          <g transform="translate(262,0)"><path d="M5 2 L5 38 M5 2 L17 14"/></g>
        </g>
      </svg>

      <div class="kenning">What is anchored cannot be unmade</div>
    </div>

    <div class="foot">
      <div class="row">
        <span class="status" id="status">Запуск…</span>
        <span class="pct" id="pct">0%</span>
      </div>
    </div>
  </div>

<script>
  // ---- API для main-процесса (вызывается через executeJavaScript) ----------
  var elStatus = document.getElementById("status");
  var elSigil = document.getElementById("sigil");
  var elRise = document.getElementById("riserect");
  var elPct = document.getElementById("pct");

  // splashStatus("Проверка реестра")            — текст этапа
  window.splashStatus = function (text) {
    if (elStatus) elStatus.textContent = text;
  };

  // splashProgress(0…1) — свет поднимается по руне снизу вверх.
  // Пока не вызван, знак просто светится и дышит: ложного прогресса нет.
  window.splashProgress = function (p) {
    p = Math.max(0, Math.min(1, Number(p) || 0));
    elSigil.classList.add("metered");
    // 40 — высота viewBox руны; +5 снизу, чтобы засветка накрывала корень
    elRise.setAttribute("y", (40 - 40 * p).toFixed(2));
    elRise.setAttribute("height", (40 * p + 5).toFixed(2));
    elSigil.setAttribute("aria-valuenow", Math.round(p * 100));
    elPct.textContent = Math.round(p * 100) + "%";
    elPct.classList.add("on");
  };

  // splashError("RPC-узел не ответил") — запуск не удался, кадр это признаёт
  window.splashError = function (text) {
    elStatus.textContent = text || "Не удалось запустить";
    elStatus.classList.add("err");
    document.querySelector(".frame").classList.add("err");
    elSigil.classList.add("metered");
    elRise.setAttribute("y", "-4");
    elRise.setAttribute("height", "48");
    elPct.classList.remove("on");
  };

  window.splashFadeOut = function () { document.body.classList.add("out"); };

  // ---- Летящие искры: кадр не должен быть мёртвым ---------------------------
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var frame = document.querySelector(".frame");
    for (var i = 0; i < 18; i++) {
      var m = document.createElement("div");
      var s = Math.random() * 1.9 + 0.7;
      m.className = "mote";
      m.style.width = m.style.height = s.toFixed(1) + "px";
      m.style.left = (Math.random() * 100).toFixed(1) + "%";
      m.style.top = (55 + Math.random() * 50).toFixed(1) + "%";
      m.style.animationDuration = (7 + Math.random() * 9).toFixed(1) + "s";
      m.style.animationDelay = (-Math.random() * 12).toFixed(1) + "s";
      m.style.opacity = (Math.random() * 0.5 + 0.3).toFixed(2);
      frame.appendChild(m);
    }
  })();
</script>
</body>
</html>
